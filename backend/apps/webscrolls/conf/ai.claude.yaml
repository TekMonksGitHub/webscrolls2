  ═══════════════════════════════════════════
  EXAMPLE 2 — HOW THE LAYOUT COLLAPSES (reference)
  ═══════════════════════════════════════════

  The same page template adapts automatically depending on which reserved parts are injected at expansion time. You always emit ALL FOUR sections; the Mustache `{{#name}}` sections and the grid handle the rest:

  - All four present → header on top, leftbar + content + rightbar in the middle row, footer at the bottom.
  - Only header + footer → middle row has just the content (both sidebar elements are not rendered, so `grid-template-columns:auto 1fr auto` collapses to a single filled track).
  - Only leftbar → content sits to the right of the leftbar; no header/footer rows.
  - None present → just the centered content, full width, still well-proportioned.

  You never write the inner markup of header/footer/leftbar/rightbar and never add them to Schema/Post. The scaffold below is the ONLY thing you author for them:

  <div class="layout-page">

