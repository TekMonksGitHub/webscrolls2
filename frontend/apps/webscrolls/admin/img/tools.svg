<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="#FFFFFF">
  <defs>
    <mask id="wrench-mask" maskUnits="userSpaceOnUse" x="-10" y="-10" width="84" height="84">
      <rect x="-10" y="-10" width="84" height="84" fill="#fff"/>
      <!-- jaw opening of the wrench -->
      <g transform="rotate(-45 32 32)">
        <rect x="28" y="0" width="8" height="13" fill="#000"/>
      </g>
      <!-- small gap around the hammer where the two tools cross -->
      <g transform="rotate(45 32 32)" fill="#000" stroke="#000" stroke-width="4" stroke-linejoin="round">
        <rect x="19" y="5" width="26" height="14" rx="2.5"/>
        <rect x="28.5" y="17" width="7" height="42" rx="3.5"/>
      </g>
    </mask>
  </defs>

  <!-- wrench -->
  <g mask="url(#wrench-mask)">
    <g transform="rotate(-45 32 32)">
      <circle cx="32" cy="13" r="10"/>
      <rect x="28.5" y="18" width="7" height="41" rx="3.5"/>
    </g>
  </g>

  <!-- hammer -->
  <g transform="rotate(45 32 32)">
    <rect x="19" y="5" width="26" height="14" rx="2.5"/>
    <rect x="28.5" y="17" width="7" height="42" rx="3.5"/>
  </g>
</svg>
