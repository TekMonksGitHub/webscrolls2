<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script type="text/javascript" src="./../../js/index.mjs"></script>
<style>
:root{
  --bg:#f6f8fc;
  --surface:#ffffff;
  --surface-2:#fbfcfe;
  --text:#172033;
  --muted:#5f6b85;
  --line:#dbe3f0;
  --line-soft:#edf2f8;
  --accent:#2f6bff;
  --accent-weak:#eef4ff;
  --shadow:0 10px 30px rgba(33, 54, 88, .10);
  --shadow-soft:0 10px 24px rgba(33, 54, 88, .08);
  --radius:16px;
  --radius-sm:12px;
  --max:1180px;
  --speed:.22s ease;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
body{min-height:100vh;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{font:inherit;}
.layout-page{display:flex;flex-direction:column;min-height:100vh;}
.layout-header,.layout-footer{width:100%;}
.layout-middle{display:grid;grid-template-columns:auto 1fr auto;gap:0;width:100%;max-width:var(--max);margin:0 auto;padding:0 1rem 2rem;min-width:0;}
.layout-leftbar,.layout-rightbar{min-width:0;}
.layout-content{min-width:0;}
.layout-header:empty,.layout-footer:empty,.layout-leftbar:empty,.layout-rightbar:empty{display:none;}

.menu-shell{
  width:100%;
  position:relative;
  z-index:20;
}
.menu-panel{
  max-width:var(--max);
  margin:0 auto;
  padding:.9rem 1rem;
  border:none;
  box-shadow:none;
  background:transparent;
}
.menu-top{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:.75rem;
}
.menu-toggle{
  appearance:none;
  border:none;
  background:transparent;
  color:var(--text);
  width:2.75rem;
  height:2.75rem;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background var(--speed), box-shadow var(--speed), transform var(--speed);
  padding:0;
}
.menu-toggle svg{width:1.15rem;height:1.15rem;display:block;}
.menu-toggle:hover,
.menu-toggle:focus-visible{
  background:rgba(47,107,255,.06);
  outline:none;
}

.menu-board{
  margin-top:.75rem;
  display:none;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-soft);
  overflow:hidden;
}
.menu-shell.is-open .menu-board{display:block;}
.menu-list{
  list-style:none;
  margin:0;
  padding:.35rem;
  display:flex;
  flex-direction:column;
  gap:.35rem;
}
.menu-group{
  background:var(--surface-2);
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  overflow:hidden;
}
.menu-group.is-open{
  border-color:var(--line-soft);
  background:#fff;
}
.menu-category{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  border:none;
  background:transparent;
  color:var(--text);
  padding:.95rem 1rem;
  cursor:pointer;
  text-align:left;
}
.menu-category strong{
  font-size:.96rem;
  font-weight:650;
  letter-spacing:-0.01em;
}
.chev{
  width:1rem;
  height:1rem;
  flex:0 0 auto;
  color:var(--muted);
  transition:transform var(--speed);
}
.menu-group.is-open .chev{transform:rotate(180deg);}
.product-list{
  list-style:none;
  margin:0;
  padding:0 .6rem .6rem;
  display:none;
}
.menu-group.is-open .product-list{display:block;}
.product-item + .product-item{margin-top:.35rem;}
.product-link{
  display:block;
  padding:.85rem .85rem;
  border-radius:12px;
  color:var(--text);
  transition:background var(--speed), transform var(--speed);
}
.product-link:hover,
.product-link:focus-visible{
  background:var(--accent-weak);
  outline:none;
}
.product-name{
  display:block;
  font-size:.94rem;
  font-weight:650;
  margin-bottom:.2rem;
}
.product-desc{
  display:block;
  color:var(--muted);
  font-size:.875rem;
  line-height:1.45;
  word-break:break-word;
}
.product-link:focus-visible .product-name,
.product-link:hover .product-name{
  color:var(--accent);
}

@media (min-width: 769px){
  .menu-panel{padding:.95rem 1rem 0;}
  .menu-board{margin-top:.7rem;}
  .menu-category{padding:1rem 1rem;}
  .menu-list{padding:.4rem;}
}

@media (max-width: 768px){
  .layout-middle{grid-template-columns:1fr;padding:0 .75rem 1.5rem;}
  .menu-panel{padding:.75rem .75rem 0;}
  .menu-toggle{width:2.65rem;height:2.65rem;}
  .menu-board{border-radius:14px;}
  .menu-category{padding:.92rem .95rem;}
  .product-link{padding:.8rem .8rem;}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{scroll-behavior:auto;transition:none !important;animation:none !important;}
}
</style>
</head>
<body>
<div class="layout-page">
  {{#header}}<div class="layout-header">{{{.}}}</div>{{/header}}

  <div class="layout-middle">
    {{#leftbar}}<aside class="layout-leftbar">{{{.}}}</aside>{{/leftbar}}

    <main class="layout-content">
      <nav class="menu-shell" aria-label="Product navigation">
        <div class="menu-panel">
          <div class="menu-top">
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-board" aria-label="Toggle menu">
              <svg class="icon-burger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <path d="M4 7h16"></path>
                <path d="M4 12h16"></path>
                <path d="M4 17h16"></path>
              </svg>
              <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display:none">
                <path d="M6 6l12 12"></path>
                <path d="M18 6 6 18"></path>
              </svg>
            </button>
          </div>

          <div class="menu-board" id="menu-board">
            <ul class="menu-list">
              {{#menu-categories}}
              <li class="menu-group">
                <button class="menu-category" type="button" aria-expanded="false">
                  <strong>{{category}}</strong>
                  <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </button>
                <ul class="product-list">
                  {{#products}}
                  <li class="product-item">
                    <a class="product-link" href="{{link}}">
                      <span class="product-name">{{product-name}}</span>
                      <span class="product-desc">{{product-description}}</span>
                    </a>
                  </li>
                  {{/products}}
                </ul>
              </li>
              {{/menu-categories}}
            </ul>
          </div>
        </div>
      </nav>
    </main>

    {{#rightbar}}<aside class="layout-rightbar">{{{.}}}</aside>{{/rightbar}}
  </div>

  {{#footer}}<footer class="layout-footer">{{{.}}}</footer>{{/footer}}
</div>

<script>
(() => {
  const shell = document.querySelector('.menu-shell');
  const toggle = shell?.querySelector('.menu-toggle');
  const burger = shell?.querySelector('.icon-burger');
  const close = shell?.querySelector('.icon-close');
  const board = shell?.querySelector('.menu-board');
  const groups = Array.from(shell?.querySelectorAll('.menu-group') || []);
  const categoryButtons = Array.from(shell?.querySelectorAll('.menu-category') || []);

  const setMenuOpen = (open) => {
    shell.classList.toggle('is-open', open);
    toggle.setAttribute('aria-expanded', String(open));
    burger.style.display = open ? 'none' : 'block';
    close.style.display = open ? 'block' : 'none';
    if (!open) {
      groups.forEach(g => {
        g.classList.remove('is-open');
        const b = g.querySelector('.menu-category');
        if (b) b.setAttribute('aria-expanded', 'false');
      });
    }
  };

  const toggleGroup = (btn) => {
    const group = btn.closest('.menu-group');
    const willOpen = !group.classList.contains('is-open');
    groups.forEach(g => {
      g.classList.remove('is-open');
      const b = g.querySelector('.menu-category');
      if (b) b.setAttribute('aria-expanded', 'false');
    });
    if (willOpen) {
      group.classList.add('is-open');
      btn.setAttribute('aria-expanded', 'true');
    }
  };

  toggle?.addEventListener('click', () => {
    setMenuOpen(!shell.classList.contains('is-open'));
  });

  categoryButtons.forEach(btn => {
    btn.addEventListener('click', () => toggleGroup(btn));
  });

  document.addEventListener('click', (e) => {
    if (!shell.contains(e.target)) setMenuOpen(false);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') setMenuOpen(false);
  });

  setMenuOpen(false);
})();
</script>
</body>
</html>
